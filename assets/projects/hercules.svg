<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Arial,Helvetica,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EAF4FC"/><stop offset="1" stop-color="#CFE8FA"/></linearGradient>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#032D60"/></marker>
<marker id="s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5B78"/></marker>
</defs>
<rect width="640" height="360" fill="url(#g)"/>

<!-- Customer -->
<rect x="14" y="85" width="112" height="170" rx="16" fill="#F1F0FF" stroke="#B9B4F0" stroke-width="2.5"/>
<circle cx="70" cy="140" r="22" fill="#F5B98A"/>
<path d="M46 136 a24 24 0 0 1 48 -4 q-10 -12 -26 -10 q-14 0 -22 14z" fill="#1B2A4A"/>
<path d="M38 200 q0 -34 32 -34 q32 0 32 34z" fill="#5B5BE0"/>
<path d="M92 128 q10 -6 10 8" fill="none" stroke="#3A33A8" stroke-width="3" stroke-linecap="round"/>
<rect x="88" y="136" width="9" height="20" rx="3" fill="#1B2A4A" transform="rotate(-12 92 146)"/>
<text x="70" y="236" text-anchor="middle" font-weight="700" font-size="15" fill="#0B2545">Customer</text>

<!-- arrow 1 -->
<line x1="126" y1="170" x2="196" y2="170" stroke="#032D60" stroke-width="3" marker-end="url(#a)"/>
<circle cx="161" cy="140" r="11" fill="#0176D3"/><text x="161" y="145" text-anchor="middle" font-weight="700" font-size="13" fill="#fff">1</text>
<text x="161" y="196" text-anchor="middle" font-weight="600" font-size="11" fill="#0B2545">Initiates</text>
<text x="161" y="209" text-anchor="middle" font-weight="600" font-size="11" fill="#0B2545">a call</text>

<!-- AWS / Amazon Connect -->
<rect x="200" y="30" width="262" height="250" rx="18" fill="#FFF3E0" stroke="#FF9900" stroke-width="3"/>
<text x="331" y="62" text-anchor="middle" font-weight="800" font-size="22" fill="#232F3E">aws</text>
<path d="M312 68 q19 9 38 0" fill="none" stroke="#FF9900" stroke-width="3" stroke-linecap="round"/>
<g transform="translate(222 84)">
<path d="M10 36 a12 12 0 0 1 4 -23 a16 16 0 0 1 30 4 a12 12 0 0 1 2 19z" fill="#1FB5B0"/>
<path d="M18 26 a10 10 0 0 1 20 0" fill="none" stroke="#0B2545" stroke-width="3"/>
<rect x="15" y="24" width="6" height="10" rx="2" fill="#0B2545"/><rect x="35" y="24" width="6" height="10" rx="2" fill="#0B2545"/>
</g>
<text x="282" y="112" font-weight="800" font-size="19" fill="#0B2545">Amazon Connect</text>

<rect x="214" y="138" width="234" height="130" rx="12" fill="none" stroke="#9AA6BC" stroke-width="1.6" stroke-dasharray="6 5"/>
<rect x="262" y="128" width="138" height="24" rx="12" fill="#CFE3FA"/>
<circle cx="278" cy="140" r="9" fill="#0176D3"/><text x="278" y="144.5" text-anchor="middle" font-weight="700" font-size="12" fill="#fff">2</text>
<text x="346" y="144" text-anchor="middle" font-weight="700" font-size="12" fill="#0B2545">Call flow runs</text>

<!-- IVR -->
<circle cx="245" cy="190" r="17" fill="#9B5DE5"/><path d="M240 181 l15 9 l-15 9z" fill="#fff"/>
<text x="245" y="228" text-anchor="middle" font-size="11" fill="#0B2545">IVR /</text>
<text x="245" y="241" text-anchor="middle" font-size="11" fill="#0B2545">Prompts</text>
<line x1="266" y1="190" x2="298" y2="190" stroke="#4A5B78" stroke-width="2" marker-end="url(#s)"/>
<!-- Routing -->
<circle cx="331" cy="178" r="6" fill="#5B5BE0"/><circle cx="318" cy="195" r="5.5" fill="#5B5BE0"/><circle cx="344" cy="195" r="5.5" fill="#5B5BE0"/>
<path d="M309 210 q0 -9 9 -9 q4 0 7 2 q3 -2 6 -2 q4 0 7 2 q3 -2 7 -2 q9 0 9 9z" fill="#5B5BE0" transform="translate(-0 -2)"/>
<text x="331" y="228" text-anchor="middle" font-size="11" fill="#0B2545">Routing</text>
<text x="331" y="241" text-anchor="middle" font-size="11" fill="#0B2545">(Queue/Agent)</text>
<line x1="362" y1="190" x2="390" y2="190" stroke="#4A5B78" stroke-width="2" marker-end="url(#s)"/>
<!-- Lambda -->
<circle cx="412" cy="190" r="19" fill="#FFF8EC"/>
<text x="408" y="203" text-anchor="middle" font-weight="700" font-size="34" fill="#FF9900">λ</text>
<circle cx="425" cy="203" r="7" fill="#232F3E"/><circle cx="425" cy="203" r="2.5" fill="#FFF3E0"/>
<text x="410" y="228" text-anchor="middle" font-size="11" fill="#0B2545">Integration</text>
<text x="410" y="241" text-anchor="middle" font-size="10" fill="#0B2545">(to Salesforce)</text>

<!-- arrow 3 -->
<line x1="462" y1="160" x2="512" y2="160" stroke="#032D60" stroke-width="3" marker-end="url(#a)"/>
<circle cx="487" cy="140" r="11" fill="#0176D3"/><text x="487" y="145" text-anchor="middle" font-weight="700" font-size="13" fill="#fff">3</text>
<text x="487" y="182" text-anchor="middle" font-weight="600" font-size="10" fill="#0B2545">Calls</text>
<text x="487" y="194" text-anchor="middle" font-weight="600" font-size="10" fill="#0B2545">Salesforce</text>

<!-- Salesforce -->
<rect x="516" y="60" width="112" height="200" rx="16" fill="#E3F6FD" stroke="#4FC3F7" stroke-width="3"/>
<g fill="#00A1E0"><circle cx="550" cy="104" r="20"/><circle cx="574" cy="96" r="24"/><circle cx="598" cy="106" r="18"/><rect x="540" y="104" width="68" height="20" rx="10"/></g>
<text x="574" y="112" text-anchor="middle" font-weight="700" font-size="13" fill="#fff">salesforce</text>
<rect x="538" y="140" width="72" height="50" rx="6" fill="#fff" stroke="#032D60" stroke-width="3"/>
<circle cx="555" cy="158" r="7" fill="#4FC3F7"/><rect x="567" y="153" width="34" height="4" rx="2" fill="#4FC3F7"/><rect x="567" y="162" width="34" height="4" rx="2" fill="#4FC3F7"/>
<rect x="568" y="190" width="12" height="8" fill="#032D60"/><rect x="556" y="198" width="36" height="5" rx="2" fill="#032D60"/>
<text x="572" y="226" text-anchor="middle" font-weight="800" font-size="15" fill="#0B2545">Salesforce</text>
<text x="572" y="244" text-anchor="middle" font-weight="800" font-size="15" fill="#0B2545">(SCV)</text>

<!-- Flow overview -->
<rect x="14" y="296" width="614" height="48" rx="14" fill="#E4E1FA"/>
<rect x="24" y="306" width="72" height="28" rx="8" fill="#3B2A86"/>
<text x="60" y="325" text-anchor="middle" font-weight="700" font-size="12" fill="#fff">Flow</text>
<g font-size="11" fill="#0B2545">
<circle cx="130" cy="320" r="8.5" fill="#0176D3"/><text x="130" y="324" text-anchor="middle" font-weight="700" font-size="10" fill="#fff">1</text>
<text x="146" y="317">Customer calls</text><text x="146" y="331">the phone number</text>
<circle cx="288" cy="320" r="8.5" fill="#0176D3"/><text x="288" y="324" text-anchor="middle" font-weight="700" font-size="10" fill="#fff">2</text>
<text x="304" y="317">Amazon Connect</text><text x="304" y="331">runs the call flow</text>
<circle cx="450" cy="320" r="8.5" fill="#0176D3"/><text x="450" y="324" text-anchor="middle" font-weight="700" font-size="10" fill="#fff">3</text>
<text x="466" y="317">AWS calls Salesforce</text><text x="466" y="331">via CTI / API</text>
</g>
</svg>
